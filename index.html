<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESTOUTFITS - Online Clothing Store</title>
    <link rel="stylesheet" href="./task5/styles.css">
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="logo-container">
            <h1 class="logo">BESTOUTFITS</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#products">Shop</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="cart-container">
                <button id="cart-btn">
                    🛒 <span id="cart-count">0</span> Items
                </button>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-text">
            <h2>Fashion Meets Comfort</h2>
            <p>Discover the latest trends and elevate your wardrobe with the finest styles.</p>
            <button class="shop-now-btn">Shop Now</button>
        </div>
    </section>

    <!-- Product Section -->
    <section id="products" class="product-section">
        <h2 class="section-title">Our Collection</h2>
        <div class="product-grid" id="product-list">
            <!-- Products will be dynamically added here -->
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2025 BESTOUTFITS. All rights reserved.</p>
        <div class="social-media">
            <a href="#">Instagram</a> | <a href="#">Facebook</a> | <a href="#">Twitter</a>
        </div>
    </footer>

    <script src="./task5/app.js"></script>
</body>
</html>
